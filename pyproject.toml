[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamos-eflint-harness"
version = "0.1.0"
description = "Black-box scenario harness that differential-tests the DYNAMOS Policy Enforcer against the eFLINT reasoner as oracle."
readme = "docs/harness.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Niels Arts" }]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: requires a running DYNAMOS environment (etcd + Policy Enforcer)",
]
